<html data-th-replace="~{layout::layout(title=~{::title},content=~{::main})}" lang="eng">
<title>Authentification</title>
<main>
  <section class="vh-100" style="background-color: #eee;">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px;">
            <div class="card-body p-md-5">
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                  <h2 class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Inscription / Connexion</h2>

                  <form th:action="@{/auth/inscription}" method="POST" class="mx-1 mx-md-4">
                    <div class="form-outline flex-fill mb-4">
                      <label class="form-label">Prénom</label>
                      <input type="text" class="form-control" name="prenom" value="John" />
                      <span th:if="${erreurs != null and erreurs['prenom'] != null}"
                            th:text="${erreurs['prenom']}" class="text-danger"></span>
                    </div>

                    <div class="form-outline flex-fill mb-4">
                      <label class="form-label">Nom</label>
                      <input type="text" class="form-control" name="nom" value="Doe" />
                      <span th:if="${erreurs != null and erreurs['nom'] != null}"
                            th:text="${erreurs['nom']}" class="text-danger"></span>
                    </div>

                    <div class="form-outline flex-fill mb-4">
                      <label class="form-label">Pseudo</label>
                      <input type="text" class="form-control" name="pseudo" value="John123" />
                      <span th:if="${erreurs != null and erreurs['pseudo'] != null}"
                            th:text="${erreurs['pseudo']}" class="text-danger"></span>
                    </div>

                    <div class="form-outline flex-fill mb-4">
                      <label class="form-label">Email</label>
                      <input type="email" class="form-control" name="email" value="John123@gmail.com" />
                      <span th:if="${erreurs != null and erreurs['email'] != null}"
                            th:text="${erreurs['email']}" class="text-danger"></span>
                    </div>

                    <div class="form-outline flex-fill mb-4">
                      <label class="form-label">Téléphone</label>
                      <input type="text" class="form-control" name="telephone" value="" />
                      <span th:if="${erreurs != null and erreurs['telephone'] != null}"
                            th:text="${erreurs['telephone']}" class="text-danger"></span>
                    </div>

                    <div class="form-outline flex-fill mb-4">
                      <label class="form-label">Mot de passe</label>
                      <input type="password" class="form-control" name="motDePasse" value="John1234" />
                      <span th:if="${erreurs != null and erreurs['motDePasse'] != null}"
                            th:text="${erreurs['motDePasse']}" class="text-danger"></span>
                    </div>

                    <div class="form-outline flex-fill mb-1">
                      <label class="form-label">Confirmer mot de passe</label>
                      <input type="password" class="form-control" value="John1234" />
                    </div>

                    <p th:if="${erreur != null}" class="text-danger mb-4" th:text="${erreur}"></p>

                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                      <button type="submit" class="btn btn-primary btn-lg">Inscription</button>
                    </div>
                  </form>

                  <form th:action="@{/auth}" method="POST" class="mx-1 mx-md-4">
                    <div class="form-outline flex-fill mb-4">
                      <label class="form-label">Pseudo</label>
                      <input type="text" id="" class="form-control" value="John123" name="pseudo"/>
                    </div>

                    <div class="form-outline flex-fill mb-1">
                      <label class="form-label">Mot de passe</label>
                      <input type="password" id="" class="form-control" value="John1234" name="motDePasse" />
                    </div>

                    <div th:if="${param.error}" class="text-danger mb-4">
                      Pseudo ou mot de passe incorrect.
                    </div>

                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                      <button type="submit" class="btn btn-primary btn-lg">Se connecter</button>
                    </div>
                  </form>

                </div>
                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                  <img src="https://mdbootstrap.com/img/Photos/new-templates/bootstrap-registration/draw1.png" class="img-fluid" alt="Sample image">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
</html>
