<html data-th-replace="~{layout::layout(title=~{::title},content=~{::main})}" lang="fr">
<title>Mon Profil — Enchères</title>
<main class="container py-5">

  <!-- Hero Banner -->
  <div class="p-4 mb-5 rounded-4 text-white text-center"
       style="background: linear-gradient(135deg, #0d6efd 0%, #0a3d91 100%);">
    <div class="position-relative d-inline-block mb-3">
      <img src="https://randomuser.me/api/portraits/men/40.jpg"
           class="rounded-circle border border-4 border-white shadow"
           style="width: 100px; height: 100px; object-fit: cover;"
           alt="Photo de profil">
    </div>
    <h2 class="fw-bold mb-1" th:text="${user.getPrenom() + ' ' + user.getNom()}">Prénom Nom</h2>
    <p class="mb-0 opacity-75" th:text="'@' + ${user.getPseudo()}">@pseudo</p>
  </div>

  <div class="row g-4">

    <!-- Sidebar -->
    <div class="col-lg-3">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3">
          <div class="nav flex-column nav-pills gap-1">
            <a class="nav-link active rounded-3 fw-semibold" href="#">
              <i class="fas fa-user me-2"></i>Informations personnelles
            </a>
            <a class="nav-link rounded-3 fw-semibold" href="#">
              <i class="fas fa-gavel me-2"></i>Mes enchères
            </a>
            <a class="nav-link rounded-3 fw-semibold" href="#">
              <i class="fas fa-box me-2"></i>Mes articles
            </a>
            <hr>
            <form th:action="@{/deconection}" method="post">
              <button type="submit"
                      class="nav-link rounded-3 fw-semibold text-danger w-100 text-start border-0 bg-transparent">
                <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
              </button>
            </form>
            <form th:action="@{/supprimer-compte}" method="POST">
              <button type="submit"
                      class="nav-link rounded-3 fw-semibold text-danger w-100 text-start border-0 bg-transparent">
                <i class="fas fa-sign-out-alt me-2"></i>Supprimer mon compte
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenu principal -->
    <div class="col-lg-9">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

          <h5 class="fw-bold mb-4">
            <i class="fas fa-user me-2 text-primary"></i>Informations personnelles
          </h5>

          <form th:action="@{/profil/modifier}" method="POST">
            <input type="hidden" name="_method" value="PATCH"/>
            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label fw-semibold">Prénom</label>
                <input type="text" class="form-control rounded-3"
                       name="prenom" th:value="${user.getPrenom()}" />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Nom</label>
                <input type="text" class="form-control rounded-3"
                       name="nom" th:value="${user.getNom()}" />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Pseudo</label>
                <input type="text" class="form-control rounded-3"
                       name="pseudo" th:value="${user.getPseudo()}" />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control rounded-3"
                       name="email" th:value="${user.getEmail()}" />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Téléphone</label>
                <input type="tel" class="form-control rounded-3"
                       name="telephone" th:value="${user.getTelephone()}" />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Crédit</label>
                <div class="input-group">
                  <input type="text" class="form-control rounded-start-3"
                         th:value="${user.getCredit()}" readonly />
                  <span class="input-group-text rounded-end-3">
                    <img src="/assets/mj.png" alt="MAJOU" style="width: 20px; height: 20px; object-fit: contain;">
                    <a href=""> Ajouter des crédits</a>
                  </span>
                </div>

              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Mot de passe actuel</label>
                <input type="password" class="form-control rounded-3"
                       name="motDePasseActuel"  />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Mot de passe</label>
                <input type="password" class="form-control rounded-3"
                       name="motDePasse"  />
              </div>

              <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                <a th:href="@{/}" class="btn btn-outline-secondary rounded-pill px-4">
                  Annuler
                </a>
                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                  <i class="fas fa-save me-2"></i>Sauvegarder
                </button>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>

  </div>
</main>
</html>
