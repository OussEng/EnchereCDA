<html data-th-replace="~{layout::layout(title=~{::title},content=~{::main})}" lang="fr">
<title>Mes crédits — Enchères</title>
<main class="container py-5">
    <div class="container py-5" id="pricing">
        <!-- Title -->
        <h2 class="display-5 fw-light text-center mb-2">Achetez des MJ</h2>
        <p class="fs-5 text-muted text-center mb-5">
            Ajoutez des crédits à votre compte pour participer aux enchères.
        </p>

        <!-- Pricing Cards -->
        <div class="row row-cols-1 row-cols-md-4 mb-3 text-center">
            <!-- 50 MJ -->
            <div class="col mb-4">
                <div class="card shadow-sm rounded-3">
                    <div class="card-header py-3">
                        <h4 class="my-0 fw-normal">50 MJ</h4>
                    </div>
                    <div class="card-body">
                        <h1 class="card-title pricing-card-title">50 <img src="/assets/mj.png" alt="MJ" style="width:24px;height:24px;"></h1>
                        <p class="text-muted">Prix : 50€</p>
                        <button class="w-100 btn btn-lg btn-primary payment-btn" data-amount="50" data-mj="50">
                            Acheter 50 MJ
                        </button>
                    </div>
                </div>
            </div>

            <!-- 100 MJ -->
            <div class="col mb-4">
                <div class="card shadow-sm rounded-3">
                    <div class="card-header py-3">
                        <h4 class="my-0 fw-normal">100 MJ</h4>
                    </div>
                    <div class="card-body">
                        <h1 class="card-title pricing-card-title">100 <img src="/assets/mj.png" alt="MJ" style="width:24px;height:24px;"></h1>
                        <p class="text-muted">Prix : 100€</p>
                        <button class="w-100 btn btn-lg btn-primary payment-btn" data-amount="100" data-mj="100">
                            Acheter 100 MJ
                        </button>
                    </div>
                </div>
            </div>

            <!-- 500 MJ -->
            <div class="col mb-4">
                <div class="card shadow-sm rounded-3 border-primary">
                    <div class="card-header py-3 text-white bg-primary border-primary">
                        <h4 class="my-0 fw-normal">500 MJ</h4>
                    </div>
                    <div class="card-body">
                        <h1 class="card-title pricing-card-title">500 <img src="/assets/mj.png" alt="MJ" style="width:24px;height:24px;"></h1>
                        <p class="text-muted">Prix : 500€</p>
                        <button class="w-100 btn btn-lg btn-primary payment-btn" data-amount="500" data-mj="500">
                            Acheter 500 MJ
                        </button>
                    </div>
                </div>
            </div>

            <!-- Custom MJ -->
            <div class="col mb-4">
                <div class="card shadow-sm rounded-3">
                    <div class="card-header py-3">
                        <h4 class="my-0 fw-normal">Custom</h4>
                    </div>
                    <div class="card-body">
                        <h1 class="card-title pricing-card-title">💰</h1>
                        <p>Choisissez votre montant en MJ</p>
                        <input type="number" class="form-control mb-3" id="customMJ" placeholder="Nombre de MJ" min="1">
                        <button class="w-100 btn btn-lg btn-primary" id="customMJBtn">Acheter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de paiement -->
    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Paiement par carte</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form action="@{/ajouter-credit}" method="POST" id="paymentForm">
                    <div class="modal-body">
                        <p id="paymentText"></p>

                        <!-- Formulaire de paiement fictif -->
                        <div class="mb-3">
                            <label for="cardName" class="form-label">Nom sur la carte</label>
                            <input type="text" class="form-control" id="cardName" value="Jean Dupont" required>
                        </div>

                        <div class="mb-3">
                            <label for="cardNumber" class="form-label">Numéro de carte</label>
                            <input type="text" class="form-control" id="cardNumber" value="4111 1111 1111 1111" required>
                        </div>

                        <div class="row">
                            <div class="col mb-3">
                                <label for="expiry" class="form-label">Date d’expiration</label>
                                <input type="text" class="form-control" id="expiry" value="12/28" required>
                            </div>
                            <div class="col mb-3">
                                <label for="cvv" class="form-label">CVV</label>
                                <input type="text" class="form-control" id="cvv" value="123" required>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-primary">Confirmer le paiement</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</html>
