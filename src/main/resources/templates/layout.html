<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" data-th-fragment="layout(title,content)">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" th:href="@{/assets/logo.png}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <title data-th-replace="${title}"></title>
</head>
<body>

<header>
  <div data-th-replace="~{fragments/header :: header}"></div>
</header>

<div class="position-fixed top-20 start-0 w-100 d-flex justify-content-center mt-3">
  <div th:if="${error}"
       class="alert alert-danger alert-dismissible fade show"
       role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <div th:if="${warning}"
       class="alert alert-warning alert-dismissible fade show"
       role="alert">
    <span th:text="${warning}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <div th:if="${success}"
       class="alert alert-success alert-dismissible fade show"
       role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
</div>

<main data-th-replace="${content}"></main>

<footer>
  <div data-th-replace="~{fragments/footer :: footer}"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

<script th:src="@{/js/auth.js}" defer></script>
<script th:src="@{/js/profile.js}" defer></script>
<script th:src="@{/js/payementCredit.js}" defer></script>
</body>
</html>
