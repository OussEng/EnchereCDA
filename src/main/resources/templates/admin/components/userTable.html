<div class="row g-3 mb-4" th:fragment="userTable">
  <div class="col-12">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Liste des Utilisateurs</h5>
      </div>
      <div class="card-body p-0">
        <table class="table mb-0">
          <thead class="table-light">
          <tr>
            <th>Id</th>
            <th>Pseudo</th>
            <th>Prénom Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Crédits</th>
            <th>Actifs</th>
            <th>Rôle</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.getPseudo()}">@John123</td>
            <td th:text="${user.getPrenom()} + ' ' + ${user.getNom()}">John Doe</td>
            <td th:text="${user.getEmail()}">john@example.com</td>
            <td th:text="${user.getTelephone()}">0</td>
            <td th:text="${user.getCredit()} + ' crédits'">0</td>
            <td class="text-center">
                  <span class="d-inline-block rounded"
                        th:classappend="${user.isActif()} ? 'bg-success' : 'bg-danger'"
                        style="width: 20px; height: 20px;">
                  </span>
            </td>
            <td th:text="${user.getRoles()}">USER</td>
            <!-- Bouton qui ouvre la modal -->
            <td>
              <button type="button"
                      class="btn btn-sm btn-outline-primary me-1"
                      data-bs-toggle="modal"
                      th:data-bs-target="'#modalModifierRole-' + ${user.id}">
                <i class="fas fa-user-shield me-1"></i>Modifier rôle
              </button>

              <form th:action="@{'/admin/supprimer/' + ${user.id}}" method="post"
                    onsubmit="return confirm('Supprimer cet utilisateur ?')"
                    style="display:inline;">

                <button type="submit" class="btn btn-sm btn-outline-danger">
                  <i class="fas fa-trash me-1"></i>Supprimer
                </button>
              </form>
            </td>

            <!-- Modal Modifier Rôle -->
            <div class="modal fade" th:id="'modalModifierRole-' + ${user.id}"
                 tabindex="-1" aria-hidden="true">
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content rounded-4 border-0 shadow">

                  <!-- Header -->
                  <div class="modal-header border-0 pb-0"
                       style="background: linear-gradient(135deg, #0d6efd 0%, #0a3d91 100%);
                        border-radius: 1rem 1rem 0 0;">
                    <h5 class="modal-title text-white fw-bold">
                      <i class="fas fa-user-shield me-2"></i>Modifier le rôle
                    </h5>
                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"
                            aria-label="Fermer"></button>
                  </div>

                  <!-- Body -->
                  <div th:replace="~{admin/components/modalFormUpdateRole :: modalFormUpdateRole}"></div>

                </div>
              </div>
            </div>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
