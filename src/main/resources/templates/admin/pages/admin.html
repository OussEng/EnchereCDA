<html data-th-replace="~{layout::layout(title=~{::title},content=~{::main})}" lang="fr">
<title>Dashboard — Administration</title>
<main class="container py-5">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 mb-0">Dashboard</h1>
        <h2 class="text-muted small mb-0" th:text="'Bienvenue, ' + ${userSuperAdmin}">Bienvenue, Admin</h2>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-muted mb-2">Total Users</h6>
                <h3 class="mb-0" th:text="${users.size()}">0</h3>
              </div>
              <div class="bg-primary bg-opacity-10 p-3 rounded">
                <i class="fas fa-users text-primary"></i>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-muted mb-2">Total Articles</h6>
                <h3 class="mb-0" th:text="${articles.size()}">0</h3>
              </div>
              <div class="bg-success bg-opacity-10 p-3 rounded">
                <i class="fas fa-newspaper text-success"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Users Table -->
    <div th:replace="~{admin/components/userTable :: userTable}"></div>

    <!-- Articles Table -->
    <div th:replace="~{admin/components/articleTable :: articleTable}"></div>

    <div th:replace="~{admin/components/categorie :: categorieTable}"></div>

  </div>
</main>
</html>
