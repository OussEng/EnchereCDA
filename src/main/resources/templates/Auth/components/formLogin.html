<div id="tab-connexion" th:fragment="formLogin">
    <form th:action="@{/auth}" method="POST">

        <div th:if="${param.error}"
             class="alert alert-danger rounded-3 mb-3">
            Pseudo ou mot de passe incorrect.
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Pseudo</label>
            <input type="text" class="form-control rounded-3"
                   name="pseudo" value="John123" />
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Mot de passe</label>
            <input type="password" class="form-control rounded-3"
                   name="motDePasse" value="John1234" />
            <div class="text-end mt-1">
                <a th:href="@{/auth/mot-de-passe-oublie}"
                   class="text-primary small text-decoration-none">
                    Mot de passe oublié ?
                </a>
            </div>
        </div>

        <div class="mb-4 d-flex align-items-center">
            <input type="checkbox" class="form-check-input me-2"
                   id="rememberMe" name="remember-me" />
            <label class="form-check-label" for="rememberMe">
                Se souvenir de moi
            </label>
        </div>

        <div class="d-grid">
            <button type="submit"
                    class="btn btn-primary rounded-pill fw-semibold py-2">
                Se connecter
            </button>
        </div>
    </form>
</div>
