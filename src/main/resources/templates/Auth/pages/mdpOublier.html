<html data-th-replace="~{layout::layout(title=~{::title},content=~{::main})}" lang="fr">
<title>Mot de passe oublié — Enchères</title>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Mot de passe oublié</h3>
          <p class="text-center text-muted mb-4">
            Entrez votre adresse email pour recevoir un lien de réinitialisation.
          </p>

          <!-- Formulaire fictif -->
          <form id="forgotPasswordForm">
            <div class="mb-3">
              <label for="email" class="form-label">Adresse email</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="email@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Envoyer le lien</button>
          </form>

          <div class="mt-3 text-center">
            <a th:href="@{/auth}">Retour à la connexion</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Bootstrap -->
  <div class="modal fade" id="emailSentModal" tabindex="-1" aria-labelledby="emailSentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="emailSentModalLabel">Email envoyé</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body text-center">
          Un lien de réinitialisation a été envoyé à votre adresse email.
        </div>
        <div class="modal-footer">
          <button type="button" id="modalCloseBtn" class="btn btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>
</main>
</html>
