
  <div class="col" th:each="article: ${articles}" th:fragment="listArticle">
    <div class="card h-100 shadow-sm border-0 article-card">

      <div class="position-relative">
        <img src="https://placehold.co/400x220/0d6efd/ffffff?text=Article"
             class="card-img-top"
             style="height: 200px; object-fit: cover;"
             alt="Image article">
        <span class="badge bg-primary position-absolute top-0 end-0 m-2 px-3 py-2 rounded-pill fs-7"
              th:text="${article.categorie.getLibelle()}">Catégorie</span>

        <!-- Sold indicator -->
        <span th:if="${article.getAcheteur() != null and article.getAcheteur().getId() != null}"
              class="position-absolute top-0 start-0 m-2 bg-success rounded-circle d-flex align-items-center justify-content-center border border-white"
              style="width: 28px; height: 28px;"
              title="Article vendu">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
         fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </span>
      </div>

      <div class="card-body d-flex flex-column">
        <!-- Nom de l'article -->
        <h5 class="card-title fw-semibold text-dark mb-3"
            th:text="${article.nom}">Nom de l'article</h5>

        <!-- Prix de mise à prix -->
        <div class="mt-auto">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <small class="text-muted">Mise à prix</small>
            <span class="fs-5 fw-bold text-primary d-flex align-items-center gap-1">
                                <img src="/assets/mj.png"
                                     alt="MAJOU"
                                     style="width: 22px; height: 22px; object-fit: contain;">
                                <span th:text="${article.miseAPrix}">0</span>
                            </span>
          </div>

          <a th:href="'/encheres/' + ${article.getId()}"
             class="btn btn-primary w-100 rounded-pill fw-semibold">
            🔍 Voir l'enchère
          </a>
        </div>
      </div>

      <!-- Pied de carte -->
      <div class="card-footer bg-light border-0 text-center">
        <small th:text="${article.etatEnchere.getLabel()}" class="text-muted"></small>
      </div>

    </div>
  </div>
