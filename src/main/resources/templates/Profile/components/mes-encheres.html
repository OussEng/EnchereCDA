<div th:fragment="mesEncheres">

    <section id="encheres" style="display:none;">
        <h5 class="fw-bold mt-3 mb-3">
            <i class="fas fa-gavel me-2 text-primary"></i>Mes enchères
        </h5>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4">

            <div class="col" th:each="article : ${mesArticles}">
                <div class="card h-100 shadow-sm border-0 article-card">

                    <!-- IMAGE -->
                    <div class="position-relative">
                        <img src="https://placehold.co/400x220/0d6efd/ffffff?text=Article"
                             class="card-img-top"
                             style="height: 200px; object-fit: cover;"
                             th:classappend="${article.etatEnchere.name() == 'EFFECTUE'} ? ' opacity-50' : ''"
                             alt="Image article">

                        <!-- CATEGORY (bottom-right) -->
                        <span class="badge bg-primary position-absolute bottom-0 end-0 m-2 px-3 py-2 rounded-pill"
                              th:text="${article.categorie.libelle}">
              Catégorie
            </span>

                        <!-- BADGES STATUS -->
                        <!-- CREEE -->
                        <span th:if="${article.etatEnchere.name() == 'CREEE'}"
                              class="badge bg-warning text-dark position-absolute top-0 start-0 m-2 px-3 py-2 rounded-pill">
              À venir
            </span>

                        <!-- EN COURS -->
                        <span th:if="${article.etatEnchere.name() == 'EN_COURS'}"
                              class="badge bg-success position-absolute top-0 start-0 m-2 px-3 py-2 rounded-pill">
              En cours
            </span>

                        <!-- EFFECTUE - GAGNÉ -->
                        <span th:if="${article.etatEnchere.name() == 'EFFECTUE' and article.acheteur.id == currentUser.id}"
                              class="badge bg-success position-absolute top-0 start-0 m-2 px-3 py-2 rounded-pill">
              Gagnée
            </span>

                        <!-- EFFECTUE - PERDU -->
                        <span th:if="${article.etatEnchere.name() == 'EFFECTUE' and article.acheteur.id != currentUser.id}"
                              class="badge bg-danger position-absolute top-0 start-0 m-2 px-3 py-2 rounded-pill">
              Perdue
            </span>

                    </div>

                    <!-- BODY -->
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-semibold text-dark mb-3"
                            th:text="${article.nom}">
                            Nom article
                        </h5>

                        <div class="mt-auto">

                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <small class="text-muted">Prix actuel</small>
                                <span class="fs-5 fw-bold text-primary d-flex align-items-center gap-1">
                  <img src="/assets/mj.png" style="width: 22px; height: 22px;">
                  <span th:text="${article.currentPrice}">0</span>
                </span>
                            </div>

                            <!-- BUTTONS -->

                            <!-- EN COURS -->
                            <a th:if="${article.etatEnchere.name() == 'EN_COURS'}"
                               th:href="'/encheres/' + ${article.id}"
                               class="btn btn-primary w-100 rounded-pill fw-semibold">
                                Voir l'enchère
                            </a>

                            <!-- CREEE (DISABLED) -->
                            <button th:if="${article.etatEnchere.name() == 'CREEE'}"
                                    class="btn btn-outline-secondary w-100 rounded-pill fw-semibold"
                                    disabled>
                                Pas encore disponible
                            </button>

                            <!-- EFFECTUE -->
                            <a th:if="${article.etatEnchere.name() == 'EFFECTUE'}"
                               th:href="'/encheres/' + ${article.id}"
                               class="btn w-100 rounded-pill fw-semibold"
                               th:classappend="${article.acheteur.id == currentUser.id} ? ' btn-success' : ' btn-outline-secondary'"
                               th:text="${article.acheteur.id == currentUser.id} ? 'Voir mon gain' : 'Voir le résultat'">
                            </a>

                        </div>
                    </div>

                    <!-- FOOTER -->
                    <div class="card-footer bg-light border-0 text-center">
                        <small class="text-muted"
                               th:text="${article.etatEnchere.getLabel()}"></small>
                    </div>

                </div>
            </div>

        </div>
    </section>

</div>
