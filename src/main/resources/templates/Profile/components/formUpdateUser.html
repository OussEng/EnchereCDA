<div id="formulaire" th:fragment="formUpdateUser">
  <h5 class="fw-bold mb-4">
    <i class="fas fa-user me-2 text-primary"></i>Informations personnelles
  </h5>

  <form th:action="@{/profile/modif}" method="POST">
    <input type="hidden" name="id" th:value="${user.id}" />
    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label fw-semibold">Prénom</label>
        <input type="text" class="form-control rounded-3"
               name="prenom" th:value="${user.getPrenom()}" />
        <span th:if="${erreurs != null and erreurs['prenom'] != null}"
              th:text="${erreurs['prenom']}"
              class="text-danger small"></span>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Nom</label>
        <input type="text" class="form-control rounded-3"
               name="nom" th:value="${user.getNom()}" />
        <span th:if="${erreurs != null and erreurs['nom'] != null}"
              th:text="${erreurs['nom']}"
              class="text-danger small"></span>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Pseudo</label>
        <input type="text" class="form-control rounded-3"
               name="pseudo" th:value="${user.getPseudo()}" />
        <span th:if="${erreurs != null and erreurs['pseudo'] != null}"
              th:text="${erreurs['pseudo']}"
              class="text-danger small"></span>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control rounded-3"
               name="email" th:value="${user.getEmail()}" />
        <span th:if="${erreurs != null and erreurs['email'] != null}"
              th:text="${erreurs['email']}"
              class="text-danger small"></span>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Téléphone</label>
        <input type="tel" class="form-control rounded-3"
               name="telephone" th:value="${user.getTelephone()}" />
        <span th:if="${erreurs != null and erreurs['telephone'] != null}"
              th:text="${erreurs['telephone']}"
              class="text-danger small"></span>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Mes crédits MAJOU</label>
        <div class="input-group">
          <input type="text" class="form-control rounded-start-3" required th:value="${user.getCredit()}" readonly />
          <span class="input-group-text rounded-end-3">
                    <img src="/assets/mj.png" alt="MAJOU" style="width: 20px; height: 20px; object-fit: contain;">
                    <a href="/profile/credits"> Ajouter des crédits MAJOU</a>
                  </span>
          <span th:if="${erreurs != null and erreurs['credit'] != null}"
                th:text="${erreurs['credit']}"
                class="text-danger small"></span>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label fw-semibold">Mot de passe actuel <span class="text-danger">*</span></label>
        <input type="password" class="form-control rounded-3"
               name="motDePasse"
               placeholder="Requis pour confirmer les modifications" />
      </div>

      <div class="col-12 d-flex justify-content-end gap-2 mt-2">
        <a class="btn btn-outline-secondary rounded-pill px-4" th:href="@{/profile}">
          Annuler
        </a>
        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
          <i class="fas fa-save me-2"></i>Sauvegarder
        </button>
      </div>
    </div>
  </form>
</div>
